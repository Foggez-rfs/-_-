name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go build -o moe-delo-server ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: go-server
          path: moe-delo-server
