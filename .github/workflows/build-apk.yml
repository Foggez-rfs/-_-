name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Generate android scaffolding
        working-directory: mobile
        run: |
          flutter create --platforms=android --org com.foggez --project-name moe_delo .

      - name: Patch AndroidManifest for HTTP traffic
        working-directory: mobile
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
          fi

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build RELEASE APK
        working-directory: mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build DEBUG APK
        working-directory: mobile
        run: flutter build apk --debug

      - name: Rename APKs
        working-directory: mobile
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/moe-delo-release.apk
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/moe-delo-debug.apk

      - name: Upload RELEASE APK
        uses: actions/upload-artifact@v4
        with:
          name: moe-delo-release-apk
          path: mobile/build/app/outputs/flutter-apk/moe-delo-release.apk

      - name: Upload DEBUG APK
        uses: actions/upload-artifact@v4
        with:
          name: moe-delo-debug-apk
          path: mobile/build/app/outputs/flutter-apk/moe-delo-debug.apk
