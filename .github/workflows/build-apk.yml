name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Generate android scaffolding
        working-directory: mobile
        run: |
          flutter create --platforms=android --org com.foggez --project-name moe_delo .

      - name: Patch AndroidManifest
        working-directory: mobile
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          fi

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: moe-delo-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Моё дело v2.0.${{ github.run_number }}
          body: |
            Сборка APK от ${{ github.event.head_commit.timestamp }}
            **Коммит:** ${{ github.sha }}
            **Автор:** ${{ github.actor }}
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
