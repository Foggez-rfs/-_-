name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows scaffolding
        working-directory: mobile
        shell: pwsh
        run: |
          flutter create --platforms=windows --org com.foggez --project-name moe_delo .

      - name: Patch CMakeLists for VS 2022
        working-directory: mobile
        shell: pwsh
        run: |
          $file = "windows\CMakeLists.txt"
          Write-Host "=== Оригинал (первые 10 строк) ==="
          Get-Content $file | Select-Object -First 10
          Write-Host ""

          $content = Get-Content $file -Raw
          $content = $content -replace 'Visual Studio 16 2019', 'Visual Studio 17 2022'
          $content | Set-Content $file -NoNewline

          Write-Host "=== После патча (первые 10 строк) ==="
          Get-Content $file | Select-Object -First 10

      - name: Get dependencies
        working-directory: mobile
        shell: pwsh
        run: flutter pub get

      - name: Build Windows EXE
        working-directory: mobile
        shell: pwsh
        run: flutter build windows --release

      - name: List build output
        working-directory: mobile
        shell: pwsh
        run: |
          Write-Host "=== build/windows ==="
          if (Test-Path "build\windows") {
            Get-ChildItem -Recurse "build\windows" -Depth 3 |
              Where-Object { $_.Name -eq "moe_delo.exe" -or $_.Name -like "*.dll" } |
              Select-Object FullName | Out-String
          } else {
            Write-Host "❌ build/windows НЕ существует"
          }

      - name: Zip portable
        working-directory: mobile
        shell: pwsh
        run: |
          $releasePath = "build\windows\x64\runner\Release"
          if (-not (Test-Path $releasePath)) {
            Write-Host "❌ $releasePath не найден"
            exit 1
          }
          Write-Host "=== Содержимое Release ==="
          Get-ChildItem $releasePath | Out-String
          Compress-Archive -Path "$releasePath\*" -DestinationPath moe-delo-windows-portable.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moe-delo-windows
          path: mobile/moe-delo-windows-portable.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-v1.0.${{ github.run_number }}
          name: Windows v1.0.${{ github.run_number }}
          body: |
            Портативная Windows-версия «Моё дело».
            Распакуйте архив и запустите `moe_delo.exe`.
          files: mobile/moe-delo-windows-portable.zip
          draft: false
          prerelease: false
